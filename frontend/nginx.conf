server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic Auth da fase de prévia: arquivo gerado na subida (docker/40-site-auth.sh). Vazio = site aberto.
    include /etc/nginx/snippets/site-auth.conf;

    # Fotos, PDFs e planilhas: o backend aceita até UPLOAD_MAX_MB (50 MB por arquivo, padrão).
    client_max_body_size 200m;

    # DNS do Docker resolvido a cada requisição: o nginx sobe mesmo com o backend ainda fora do ar.
    resolver 127.0.0.11 valid=10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Healthcheck do contêiner, fora da senha.
    location = /nginx-health {
        auth_basic off;
        access_log off;
        return 200 "ok";
    }

    # Vue Router em modo history.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mesma origem do frontend: sem CORS, cookies de sessão httpOnly.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }

    location = /health {
        auth_basic off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
    }
}
