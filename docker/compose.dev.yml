# Ambiente local em Docker: backend e frontend. O banco é o Postgres compartilhado da máquina (C:\Source\infra,
# container "postgres" na rede "db"), como no servidor, que usa o do servidor02-infra: o MineRecycle não sobe banco
# próprio. O usuário e os databases (minerecycle e minerecycle_test) são criados uma vez no infra (ver README).
#   cd C:\Source\infra && docker compose up -d
#   docker compose -f docker/compose.dev.yml up -d --build
# Site: http://localhost:8084. Senha do banco, segredos e admin vêm do .env da raiz (o mesmo do npm run dev); aqui só
# muda o que é diferente dentro do container.
name: minerecycle-dev

services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost:${DEV_FRONTEND_PORT:-8084}
      STORAGE_DIR: storage/files
      # A imagem não tem as dependências de desenvolvimento (pino-pretty), que o .env do npm run dev pode ligar.
      LOG_PRETTY: "false"
    # Migrations e seeders estruturais (admin, configuração padrão) a cada subida, como o deploy faz.
    command: sh -c "npm run db:migrate && npm run db:seed && node src/server.js"
    volumes:
      # Mesma pasta do "npm run dev" (backend/storage, fora do git): os dois modos veem os mesmos arquivos.
      - ../backend/storage:/app/storage
    networks:
      - default
      - db

  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      # Vazio: site aberto. Com valor: o site inteiro pede usuário e senha (Basic Auth), como na fase de prévia.
      SITE_USER: ${SITE_USER:-preview}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-8084}:80"
    depends_on:
      - backend

networks:
  db:
    external: true
